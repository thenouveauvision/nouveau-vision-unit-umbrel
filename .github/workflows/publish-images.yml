name: Publish NVU Dashboard Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dashboard version to publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-dashboard:
    name: Build and publish NVU Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4

      - name: Validate requested version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Dashboard version: $VERSION"
            exit 1
          fi

          grep -Fq \
            "\"dashboardVersion\": \"$VERSION\"" \
            nouveau-vision-nvu/dashboard/server.py

          grep -Fq \
            "Dashboard $VERSION" \
            nouveau-vision-nvu/dashboard/static/index.html

          echo "PASS: source identifies as Dashboard $VERSION"

      - name: Set lowercase repository owner
        id: owner
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Dashboard
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./nouveau-vision-nvu/dashboard
          file: ./nouveau-vision-nvu/dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/nouveau-vision-dashboard:${{ inputs.version }}

      - name: Report published image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ steps.owner.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ghcr.io/${OWNER}/nouveau-vision-dashboard:${VERSION}"
          echo "Digest: ${DIGEST}"

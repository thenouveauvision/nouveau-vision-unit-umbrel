manifestVersion: 1
id: nouveau-vision-nvu
name: Nouveau-Vision NVU
tagline: Run an NVU full node and solo mining pool on Umbrel
icon: https://nvu.us/nvu-umbrel-app-icon.png
category: bitcoin
version: "1.2.2"
port: 3340

description: >-
  Run a Nouveau-Vision Unit full node and ASICseer solo mining pool
  directly on Umbrel. NVUN connects to the Nouveau-Vision peer-to-peer
  network while ASICseer provides solo SHA-256 mining through Stratum
  on TCP port 3336.

developer: Nouveau-Vision
website: https://nvu.us
submitter: Nouveau-Vision
submission: https://github.com/thenouveauvision/nouveau-vision-unit-umbrel
repo: https://github.com/thenouveauvision/nouveau-vision-unit-umbrel
support: https://nvu.us
gallery:
  - https://nvu.us/umbrel/gallery/nvu-overview.png
  - https://nvu.us/umbrel/gallery/nvu-network.png
  - https://nvu.us/umbrel/gallery/nvu-mining.png
  - https://nvu.us/umbrel/gallery/nvu-wallet.png

releaseNotes: >-
  Updates Dashboard to 1.2.2 with compact Peta (P) and Exa (E)
  number formatting. Adds polished Overview, Network, Mining, and
  Wallet gallery screenshots. Repository references use the renamed
  nouveau-vision-unit-umbrel repository. NVUN 1.0.0 and
  ASICseer-NVU 1.0.0 remain unchanged.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
